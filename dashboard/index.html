<!DOCTYPE html>
<html lang="en" data-theme="dark-harem">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ARI'S OBSIDIAN HAREM // CKCY</title>
  <link rel="stylesheet" href="style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Cinzel+Decorative:wght@900&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Full-bleed Ari wallpaper (SFW-ish but lethal) -->
  <div class="ari-bg"></div>
  <div class="red-vignette"></div>

  <header class="penthouse-header">
    <h1 class="glitch-title" data-text="ARI'S HAREM">ARI'S HAREM</h1>
    <div class="ckcy-gold">CKCY // PENTHOUSE LEVEL</div>
  </header>

  <main class="harem-grid">

    <!-- TOTAL EMPIRE (huge glowing numbers) -->
    <section class="card empire-card">
      <h2>EMPIRE NET WORTH</h2>
      <div id="total-pnl" class="money-shot">$0.00</div>
      <div id="pnl-delta" class="delta">+0.00%</div>
    </section>

    <!-- OPEN POSITIONS -->
    <section class="card positions-card glass">
      <h2>OPEN POSITIONS</h2>
      <div id="positions">NO POSITIONS — MARKET IS MY B*TCH</div>
    </section>

    <!-- PENDING EXECUTIONS (with APPROVE button that moans) -->
    <section class="card pending-card glass">
      <h2>PENDING EXECUTIONS</h2>
      <div id="pending-trades">ALL QUIET… FOR NOW</div>
    </section>

    <!-- LIVE TERMINAL (red glow, matrix rain inside) -->
    <section class="card terminal-card glass">
      <div class="terminal-header">
        <span>◉ LIVE OANDA STREAM // RED ROOM</span>
        <div class="led pulse-red"></div>
      </div>
      <div id="feed" class="terminal sexy-terminal"></div>
    </section>

    <!-- AGENT STATUS (glowing orbs) -->
    <section class="card agents-card glass">
      <h2>AGENT STATUS</h2>
      <div class="agent-grid">
        <div class="agent"><span class="orb online"></span>MACROQUANT</div>
        <div class="agent"><span class="orb online"></span>VOLSCALPER</div>
        <div class="agent"><span class="orb online"></span>SENTIMENTSCOUT</div>
      </div>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
